name: "Pull Request Checks"

on:
  pull_request:

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: pull_request_checks.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ##
  # install
  ##

  install:
    timeout-minutes: 60
    name: "Install"
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies

  ##
  # lint, build documentation, build package and test
  ##

  lint:
    timeout-minutes: 60
    name: "Lint"
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies
      - name: "👕 Lint"
        run: bun run lint

  build_documenation:
    timeout-minutes: 60
    name: "Build Documentation"
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies
      - name: "🏗️ Build"
        run: bun run docs:build

  build_pakage:
    timeout-minutes: 60
    name: "Build Package"
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies
      - name: "🏗️ Build"
        run: bun run build

  test:
    timeout-minutes: 60
    name: "Test"
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies
      - name: "🧪 Test"
        run: bun run test
