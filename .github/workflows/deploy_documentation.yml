name: "Deploy Documentation"

on:
  push:
    branches:
      - main
      - beta

jobs:
  install:
    name: "Install"
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies

  deploy:
    name: "Deploy"
    needs: install
    permissions:
      contents: write # to be able to push to the gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies
      - name: "🏗️ Build"
        run: bun run docs:build
      - name: "🚀 Deploy"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_READ_AND_WRITE_REPOS_TOKEN }}
          publish_dir: ./.docs
          user_name: nearbuilder
          user_email: tech@nearbuilders.org
