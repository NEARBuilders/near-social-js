name: "Release"

on:
  push:
    branches:
      - beta
      - main

permissions:
  id-token: write      # Required for npm OIDC provenance
  contents: write      # For publishing GitHub release and pushing commits
  issues: write        # For commenting on released issues
  pull-requests: write # For commenting on released pull requests

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies

      - name: "🏗️ Build"
        run: bun run build

      - name: "🔖 Release"
        env:
          GIT_AUTHOR_NAME: nearbuilder
          GIT_AUTHOR_EMAIL: tech@nearbuilders.org
          GIT_COMMITTER_NAME: nearbuilder
          GIT_COMMITTER_EMAIL: tech@nearbuilders.org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release

      - name: "📦 Publish to npm"
        run: |
          NPM_VERSION=$(npm view near-social-js version 2>/dev/null || echo "0.0.0")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          if [ "$NPM_VERSION" != "$LOCAL_VERSION" ]; then
            echo "Publishing version $LOCAL_VERSION (npm has $NPM_VERSION)"
            npm publish --provenance --access public
          else
            echo "Version $LOCAL_VERSION already published on npm, skipping"
          fi
