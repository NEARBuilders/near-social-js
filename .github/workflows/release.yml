name: "Release"

on:
  push:
    branches:
      - beta
      - main

permissions:
  id-token: write      # Required for npm OIDC provenance
  contents: write      # For publishing GitHub release and pushing commits
  issues: write        # For commenting on released issues
  pull-requests: write # For commenting on released pull requests

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: "📦 Setup Bun Dependencies"
        uses: ./.github/actions/use-bun-dependencies

      - name: "🏗️ Build"
        run: bun run build

      - name: "🔖 Release"
        id: release
        env:
          GIT_AUTHOR_NAME: nearbuilder
          GIT_AUTHOR_EMAIL: tech@nearbuilders.org
          GIT_COMMITTER_NAME: nearbuilder
          GIT_COMMITTER_EMAIL: tech@nearbuilders.org
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run semantic-release
          if git diff --name-only HEAD^ HEAD | grep -q "package.json"; then
            echo "new_release=true" >> $GITHUB_OUTPUT
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
          fi

      - name: "📦 Publish to npm"
        if: steps.release.outputs.new_release == 'true'
        run: npm publish --provenance --access public
